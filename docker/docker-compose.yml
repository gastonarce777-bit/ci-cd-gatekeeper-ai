version: '3.8'

networks:
  n8n_net:
    driver: bridge

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n_nuevo
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=https://tu-tunnel-url.trycloudflare.com/
    networks:
      - n8n_net

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared_tunnel
    restart: always
    command: tunnel --url http://n8n_nuevo:5678
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - n8n_net
    depends_on:
      - n8n